<section class="ChangePassword">
  <div class="ChangePassword__Form">
    <h1 class="ChangePassword__Form__Content__Title">ESTABLECER CONTRASEÑA</h1>
    <form
      [formGroup]="form"
      (ngSubmit)="updatePassword()"
      class="ChangePassword__Form__Content"
      autocomplete="off"
    >
      <p>Ingrese una contraseña nueva de al menos 8 caracteres.</p>
      <app-form-field-password
        [label]="'Nueva contraseña'"
        [placeholder]="'Ingrese la nueva contraseña'"
        [controlName]="'password'"
        [control]="form.controls.password"
        [messageErrors]="passwordErrors"
      />
      <app-form-field-password
        [label]="'Confirmar contraseña'"
        [placeholder]="'Repita la nueva contraseña'"
        [controlName]="'confirmation'"
        [control]="form.controls.confirmation"
        [messageErrors]="passwordErrors"
      />
      <button mat-raised-button type="submit" class="button-border" [disabled]="saving">
        {{ saving ? 'GUARDANDO…' : 'GUARDAR CONTRASEÑA' }}
      </button>
    </form>
  </div>
  <div class="ChangePassword__Background">
    <img src="logo-jne-blanco.svg" alt="Jurado Nacional de Elecciones" height="500" width="350" />
  </div>
</section>
