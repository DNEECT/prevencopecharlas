<section class="RecoverPassword">
  <div class="RecoverPassword__Form">
    <h1 class="RecoverPassword__Form__Content__Title">RECUPERAR CONTRASEÑA</h1>
    <form
      [formGroup]="form"
      (ngSubmit)="sendRecovery()"
      class="RecoverPassword__Form__Content"
      autocomplete="off"
    >
      <p>
        Ingrese su correo institucional. Recibirá un enlace para establecer una nueva contraseña.
      </p>
      <app-form-field-input
        [label]="'Correo institucional'"
        [placeholder]="'Ingrese su correo'"
        [controlName]="'email'"
        [control]="form.controls.email"
        [messageErrors]="emailErrors"
      />
      <button mat-raised-button type="submit" class="button-border" [disabled]="sending || sent">
        {{ sending ? 'ENVIANDO…' : sent ? 'CORREO SOLICITADO' : 'ENVIAR ENLACE' }}
      </button>
      <a [routerLink]="['/login']">Volver al inicio de sesión</a>
    </form>
  </div>
  <div class="RecoverPassword__Background">
    <img src="logo-jne-blanco.svg" alt="Jurado Nacional de Elecciones" height="500" width="350" />
  </div>
</section>
