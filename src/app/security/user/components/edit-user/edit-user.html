<div class="container">
  <div class="title-form">
    <h2>Usuario</h2>
  </div>

  <app-form-user [form]="userForm" [errorMessagesForm]="errorMessagesForm"> </app-form-user>

  <div class="button-container">
    <button mat-raised-button (click)="cancelUser()" class="button-border">Cancelar</button>
    <button
      mat-raised-button
      (click)="updateUser()"
      [disabled]="userForm.invalid"
      class="button-prevencope"
    >
      Actualizar
    </button>
  </div>
</div>
