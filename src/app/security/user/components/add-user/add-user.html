<div class="container">
  <div class="title-form">
    <h2>Usuario</h2>
  </div>

  <app-form-user [form]="userForm" [errorMessagesForm]="errorMessagesForm"> </app-form-user>

  <div class="button-container">
    <button mat-raised-button class="button-border" (click)="cancelUser()">Cancelar</button>
    <button
      mat-raised-button
      (click)="createUser()"
      [disabled]="userForm.invalid"
      class="button-prevencope"
    >
      Guardar
    </button>
  </div>
</div>
