<div class="breadcrumbs-wrapper">
  <nav class="breadcrumbs">
    @if (root) {
      <a class="crumb-link">{{ root.name }}</a>
      <span class="crumb-sep">/</span>
      @for (item of paths; track item; let last = $last) {
        @if (!last) {
          <a [routerLink]="item.path" class="crumb-link">{{ item.name }}</a>
          <span class="crumb-sep">/</span>
        } @else {
          <span class="crumb-current">{{ item.name }}</span>
        }
      }
    }
  </nav>

  <div class="theme-toggle">
    <button
      mat-icon-button
      class="icon-toggle"
      type="button"
      (click)="modeChange()"
      [attr.aria-pressed]="!darkMode"
      aria-label="Alternar modo oscuro"
      title="Alternar modo oscuro"
    >
      <mat-icon>{{ darkMode ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </button>
  </div>
</div>
