name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - supabase-migration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify proxy origin policy
        run: npm run test:proxy

      - name: Build Angular application
        run: npm run build
